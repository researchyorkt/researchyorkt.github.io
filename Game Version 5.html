<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dcefeb">
<title>Once Upon a Journey</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<style>
:root{
  --sea:#dcefeb; --paper:#fbfdfc; --ink:#16314a; --ink-soft:#4a6178; --line:#b9d4cf;
  --coral:#ee6c4d; --sun:#f6b73c; --lagoon:#2a9d8f; --danger:#b3402b; --plum:#2a1646;
  --radius:18px;
  --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--sea:#10242f; --paper:#17323f; --ink:#e8f3f0; --ink-soft:#a3bcc4; --line:#2c4b57; --danger:#ff8d77;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--sans);line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 64px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0}
h1{font-size:clamp(2.2rem,8vw,3.4rem);letter-spacing:-.01em}
h2{font-size:1.5rem}
h3{font-size:1.2rem}
p{margin:0}
.lede{color:var(--ink-soft);margin:.5rem 0 0;max-width:50ch}
.lbl{display:block;font-weight:600;margin-bottom:6px}
.hint{font-size:.85rem;color:var(--ink-soft);margin:2px 0 8px}

.btn{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;transition:background .15s,color .15s,transform .1s}
.btn:hover{background:var(--ink);color:var(--sea)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff;padding:13px 26px;font-size:1.05rem}
.btn.primary:hover{background:#d85a3c;border-color:#d85a3c;color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.actions{margin:22px 0 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* faces */
.face{width:100%;height:100%;overflow:visible;display:block}
.face .smile,.face .frown{display:none}
.face.happy .smile,.face.m-happy .smile,.face.m-love .smile{display:block}
.face.happy .flat,.face.m-happy .flat,.face.m-love .flat,.face.m-sad .flat{display:none}
.face.m-sad .frown{display:block}
.face.m-love .cheek{opacity:.7}
.face.happy{animation:wiggle .5s}
@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.face-btn{background:none;border:0;padding:0;display:block;margin:0 auto 4px;width:84px;height:84px;border-radius:50%}

/* home */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
@media (min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}.grid.many{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--radius);padding:16px 10px 12px;text-align:center;position:relative}
.x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--paper);color:var(--ink-soft);font-size:1.1rem;line-height:1;display:grid;place-items:center;padding:0}
.x:hover{border-color:var(--danger);color:var(--danger)}
.pname{font-family:var(--serif);font-size:1.05rem;font-weight:700;margin:2px 0 8px;overflow-wrap:anywhere}
.add{margin-top:14px}
.min-note{font-size:.85rem;color:var(--ink-soft);margin:12px 0 0}
.sect{margin-top:30px}
.sect h2{margin-bottom:4px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 4px}
.minis.two{grid-template-columns:repeat(2,1fr)}
.mini{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;line-height:1.25;font-size:.84rem}
.mini .me{font-size:1.7rem;display:block;margin-bottom:2px}
.mini b{display:block;font-size:.95rem}
.mini[aria-pressed=true]{border-color:var(--coral);background:linear-gradient(rgba(238,108,77,.16),rgba(238,108,77,.16)),var(--paper)}
.camline{font-size:.9rem;color:var(--ink-soft);margin-top:10px}
details.more{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:22px}
details.more summary{cursor:pointer;font-weight:600}
details.more h3{font-size:1.05rem;margin:16px 0 4px}
details.more p{font-size:.94rem}
details.more ul,details.more ol{margin:6px 0 0;padding-left:1.3em;font-size:.94rem}
details.more li{margin:5px 0}
details.more .heroh{color:var(--lagoon)}
details.more .vilh{color:var(--danger)}
footer{margin-top:44px;padding-top:18px;border-top:2px dashed var(--line);font-size:.88rem;color:var(--ink-soft)}
footer .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.field{margin:16px 0}
.field>label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=password]{width:100%;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:var(--sea)}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(10,25,38,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.overlay.top{z-index:30}
@media (min-width:640px){.overlay{align-items:center}}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:rise .25s ease-out}
.sheet.narrow{max-width:420px}
@media (min-width:640px){.sheet{border-radius:24px}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.sheet header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sheet header .face-btn{width:64px;height:64px;margin:0;flex-shrink:0}
.src{font-size:.82rem;color:var(--ink-soft);margin:2px 0 0}
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:480px){.picker{grid-template-columns:repeat(6,1fr)}}
.pick{border:2px solid var(--line);background:transparent;border-radius:14px;padding:6px 2px 4px;font-size:.7rem;line-height:1.15;text-align:center}
.pick .pv{width:48px;height:48px;margin:0 auto 2px}
.pick[aria-pressed=true]{border-color:var(--coral);background:linear-gradient(rgba(238,108,77,.16),rgba(238,108,77,.16)),var(--paper)}
.pick[disabled]{opacity:.35;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:.92rem}
.chip[aria-pressed=true]{background:var(--lagoon);border-color:var(--lagoon);color:#fff}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.checkrow{display:flex;gap:10px;align-items:center;font-size:.92rem;margin-top:10px}
.checkrow input{width:20px;height:20px;accent-color:var(--coral)}
.warnbox{background:rgba(246,183,60,.18);border:2px solid var(--sun);border-radius:12px;padding:10px 12px;font-size:.88rem;margin-top:14px}
.banner{background:rgba(246,183,60,.18);border:2px solid var(--sun);border-radius:12px;padding:10px 14px;font-size:.92rem;margin:16px 0}
.banner.err{background:rgba(179,64,43,.12);border-color:var(--danger)}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud-mid{flex:1;min-width:0}
.hl{font-size:.82rem;color:var(--ink-soft);display:block;margin-bottom:3px}
.hope{display:flex;gap:3px}
.hope i{flex:1;height:10px;border-radius:99px;background:var(--line);transition:background .6s}
.hope i.on{background:linear-gradient(90deg,var(--sun),var(--coral))}
.chip-soft{font-size:.78rem;color:var(--ink-soft);white-space:nowrap}
.cam{border:2px solid var(--lagoon);background:transparent;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;color:var(--lagoon);white-space:nowrap}

/* stage */
.stage{position:sticky;top:8px;z-index:5;height:300px;border-radius:var(--radius);overflow:hidden;border:3px solid var(--ink);background:#222}
@media (max-width:480px){.stage{height:280px}}
@media (max-height:720px){.stage{height:220px}}
.bd{position:absolute;inset:0}
.bd svg{width:100%;height:100%;display:block}
.cloud{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(40px)}}
.bulb{animation:twinkle 1s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
.prop{position:absolute;top:10px;right:14px;font-size:2.6rem;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
@keyframes bob{50%{transform:translateY(-8px)}}
.pathline{position:absolute;left:0;right:0;bottom:20px;height:4px;opacity:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 14px,transparent 14px 28px)}
.stage.moving .pathline{opacity:1;animation:walk 1s linear infinite}
@keyframes walk{to{background-position:-28px 0}}
.bubble{position:absolute;top:10px;left:12px;right:84px;max-width:400px;background:#fff;color:#16314a;border-radius:14px;padding:6px 11px;font-size:.9rem;line-height:1.25;box-shadow:0 3px 10px rgba(0,0,0,.25);animation:pop .3s ease-out}
.bubble[hidden]{display:none}
.bubble .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.stage.nopropv .bubble{right:12px}
.cast{position:absolute;left:0;right:0;bottom:6px;display:flex;align-items:flex-end;padding:0 6px}
.actor{flex:1 1 0;min-width:0;max-width:120px;margin:0 auto;text-align:center;position:relative}
.actor .av{width:min(78px,88%);aspect-ratio:1;margin:0 auto}
.actor .nm{display:block;font-size:.68rem;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.fx{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:1.3rem;pointer-events:none;z-index:2}
.fx.love,.fx.happy{animation:floatup 1.8s ease-out infinite}
.fx.meh{animation:bob 2s ease-in-out infinite}
.fx.sad{animation:drip 1.4s ease-in infinite}
@keyframes floatup{from{opacity:0;transform:translate(-50%,10px)}30%{opacity:1}to{opacity:0;transform:translate(-50%,-22px)}}
@keyframes drip{from{opacity:0;transform:translate(-50%,-6px)}30%{opacity:1}to{opacity:0;transform:translate(-50%,16px)}}
.cast.walk-in .actor{animation:walkin .9s ease-out both;animation-delay:calc(var(--i)*.14s)}
@keyframes walkin{from{opacity:0;transform:translateX(-140%)}}
.cast.acting.lively .av{animation:hop .55s ease-in-out infinite alternate}
.cast.acting.calm .av{animation:sway 1.8s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-9px)}}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.actor.speaking .av{animation:talk .45s ease-in-out 3}
@keyframes talk{50%{transform:translateY(-12px) scale(1.06)}}
.actor.spot .av{transform:scale(1.22);transform-origin:50% 100%}
.panel{margin-top:14px;background:var(--paper);border:2px solid var(--line);border-radius:var(--radius);padding:16px}
.narr{display:flex;gap:10px;align-items:flex-start}
.narr-ico{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:var(--plum);display:grid;place-items:center;font-size:1.2rem}
.narr-text{font-size:1rem;padding-top:5px}
.kick{font-size:.82rem;color:var(--ink-soft)}
.meta{font-size:.9rem;color:var(--ink-soft)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
.optlist{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.opt .oe{font-size:1.7rem}
.opt b{font-weight:600}
.tally{margin-top:12px;display:grid;gap:8px}
.trow{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:8px 12px;animation:pop .4s ease-out both;animation-delay:calc(var(--k)*.5s)}
.trow.win{border-color:var(--sun);background:rgba(246,183,60,.22)}
.trow .te{font-size:1.6rem}
.trow .tmid{flex:1;min-width:0;font-weight:600;line-height:1.25}
.trow .tcount{font-family:var(--serif);font-size:1.6rem;font-weight:700}
.later{animation:pop .5s ease-out both;animation-delay:var(--d,1.8s)}
.notice{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(42,22,70,.1);border:2px solid var(--plum);font-size:.95rem}
.timer{font-family:var(--serif);font-size:2.6rem;text-align:center;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.pcast{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.pcast .pc{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600}
.pcast .pc .mv{width:36px;height:36px}

/* secret screens */
.secret{background:linear-gradient(180deg,#2a1646,#3b1d57);color:#fff;border-radius:var(--radius);padding:20px 18px;min-height:400px;position:relative}
.secret h2{color:#fff}
.secret .sub{color:#d9c9f0;font-size:.92rem;margin-top:4px}
.secret .btn{border-color:#fff;color:#fff}
.secret .btn:hover{background:#fff;color:#2a1646}
.secret .btn.primary{background:var(--coral);border-color:var(--coral)}
.secret .btn[disabled]:hover{background:transparent;color:#fff}
.secret .btn.primary[disabled]:hover{background:var(--coral);color:#fff}
.lock{text-align:center}
.lock .big{width:120px;height:120px;margin:6px auto 10px;animation:bob 2.4s ease-in-out infinite}
.camprev{width:132px;height:99px;border-radius:14px;object-fit:cover;transform:scaleX(-1);border:4px solid #888;background:#111;margin:12px auto 4px;display:block}
.camprev.clear{border-color:#4fd18b}
.camprev.pending{border-color:#f6b73c}
.camprev.crowded,.camprev.empty{border-color:#ff6b57}
.gstat{font-weight:600;margin:8px 0 14px;min-height:1.5em}
.gbar{font-size:.8rem;color:#bfe9d0;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.gbar i{width:9px;height:9px;border-radius:50%;background:#4fd18b;display:inline-block}
.rolecard{text-align:center;padding:6px 0}
.rolecard .rbig{font-size:4rem;line-height:1.1}
.rolecard p{margin:10px auto 18px;max-width:34ch}
.rolecard.vil h2{color:#ff9d8c}
.clue{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);border-radius:16px;padding:14px 16px;margin-top:14px;font-size:1.05rem}
.clue .tag{display:inline-block;font-size:.75rem;font-weight:800;border-radius:999px;padding:1px 10px;margin-bottom:6px;background:var(--sun);color:#3b2a00}
.clue .tag.faint{background:#cdbbe8;color:#2a1646}
.truth{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.truth li{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;border-left:6px solid}
.truth li.good{border-color:#4fd18b}
.truth li.mixed{border-color:#f6b73c}
.truth li.trap{border-color:#ff6b57}
.truth small{display:block;color:#d9c9f0}
.vopts{display:grid;gap:10px;margin-top:14px}
.vopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);border-radius:16px;padding:12px;color:#fff}
.vopt:hover{border-color:#fff}
.vopt.sel{border-color:var(--sun);background:rgba(246,183,60,.22)}
.vopt .num{width:32px;height:32px;border-radius:50%;background:#fff;color:#2a1646;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.vopt .ve{font-size:1.7rem}
.vopt .vl{flex:1;line-height:1.25}
.vopt .va{width:36px;height:36px;flex-shrink:0}
.shadow{display:flex;gap:10px;align-items:center;margin-top:14px;background:rgba(0,0,0,.25);border:2px dashed #ff9d8c;border-radius:14px;padding:10px 12px;font-size:.94rem}
.shadow input{width:20px;height:20px;flex-shrink:0;accent-color:#ff6b57}
.fing{margin-top:14px;font-size:.88rem;color:#d9c9f0}
.fbar{height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:6px}
.fbar i{display:block;height:100%;width:0;background:var(--sun);transition:width .12s linear}
.guide{text-align:left;margin-top:6px}
.guide h3{font-size:1rem;color:#fff;margin:14px 0 2px}
.guide ol,.guide ul{margin:6px 0 0;padding-left:1.3em;font-size:.95rem}
.guide li{margin:5px 0}
.goalline{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;margin:12px 0 0;font-size:.95rem;text-align:left}
details.remind{margin-top:16px;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;font-size:.9rem}
details.remind summary{cursor:pointer;font-weight:600}
details.remind ul{margin:8px 0 2px;padding-left:1.2em}
details.remind li{margin:4px 0}
.obst{position:absolute;inset:0;pointer-events:none;transition:opacity .8s,filter .8s}
.obst svg{width:100%;height:100%;display:block}
.floaty{animation:bob 2.6s ease-in-out infinite}
.pulse{animation:pulseA 1.6s ease-in-out infinite alternate}
.twinkle{animation:pulseA 1.1s ease-in-out infinite alternate}
@keyframes pulseA{from{opacity:.55}to{opacity:1}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:swayb 2.6s ease-in-out infinite alternate}
@keyframes swayb{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.swirl{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.rain line{animation:rainfall .9s linear infinite}
@keyframes rainfall{from{transform:translate(0,0);opacity:0}15%{opacity:1}to{transform:translate(-8px,72px);opacity:0}}
.bolt{opacity:.9;animation:flash 3.2s infinite}
@keyframes flash{0%,86%,100%{opacity:0}88%{opacity:1}90%{opacity:.1}92%{opacity:1}96%{opacity:0}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripp 2.4s ease-out infinite}
@keyframes ripp{from{transform:scale(.6);opacity:.9}to{transform:scale(1.25);opacity:0}}
.titlecard{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;background:rgba(14,18,40,.62);opacity:0;pointer-events:none;animation:tcard 3.4s ease-in-out both;padding:0 18px;z-index:4}
.titlecard small{display:block;font-size:.85rem;opacity:.85;margin-bottom:4px}
.titlecard h2{color:#fff;font-size:clamp(1.5rem,6vw,2.2rem);text-shadow:0 2px 12px rgba(0,0,0,.6)}
@keyframes tcard{0%{opacity:0;transform:scale(.96)}14%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0}}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;z-index:3}
.stage.res-good::after{opacity:1;background:radial-gradient(circle at 50% 42%,rgba(255,230,120,.6),transparent 68%)}
.stage.res-mixed::after{opacity:1;background:radial-gradient(circle at 50% 42%,rgba(210,210,210,.4),transparent 70%)}
.stage.res-trap::after{opacity:1;background:radial-gradient(circle at 50% 42%,rgba(255,60,40,.55),transparent 72%)}
.stage.res-trap{animation:shake .55s}
.stage.res-mixed{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.stage.res-good .obst{opacity:.3;filter:saturate(.4)}
.burst{position:absolute;left:50%;top:38%;font-size:4.2rem;opacity:0;transform:translate(-50%,-50%);animation:burst 1.4s ease-out both;pointer-events:none;z-index:4}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.5)}100%{opacity:0;transform:translate(-50%,-70%) scale(1.1)}}
.starters{margin:12px 0 0;padding-left:1.2em;font-size:.95rem}
.starters li{margin:5px 0}
.truth-row{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
.truth-row .tt{font-weight:600;margin-bottom:6px}
.kopt{display:flex;gap:10px;align-items:center;font-size:.92rem;margin:4px 0}
.kopt .kt{font-size:.72rem;font-weight:800;border-radius:999px;padding:1px 9px;color:#fff;flex-shrink:0}
.kt.good{background:var(--lagoon)}
.kt.mixed{background:#c98a14}
.kt.trap{background:var(--danger)}
.kopt.pickd{font-weight:700}
.thumbhint{margin-top:12px;font-size:.88rem;color:var(--ink-soft)}
.secret .thumbhint{color:#d9c9f0}
.panel .fbar{background:var(--line)}
.panel .fbar i{background:var(--coral)}
.shadow b{font-family:var(--serif)}
.hintbox{margin-top:12px}
.hintbox>b{font-size:.85rem;color:#d9c9f0;font-weight:600}
.hintbox .clue{margin-top:6px;padding:10px 12px;font-size:.98rem}
.truth.compact{gap:5px;margin-top:6px}
.truth.compact li{padding:6px 10px;font-size:.92rem}
.breach{text-align:center;padding:40px 0}
.breach .bi{font-size:3.4rem}
.sealed{text-align:center;padding:44px 0}
.sealed .tk{font-size:3.4rem;animation:ticket .8s ease-out both}
@keyframes ticket{from{opacity:0;transform:translateY(40px) rotate(-30deg) scale(.4)}}

/* ending */
.endban{text-align:center;padding:6px 0 4px}
.endban .eb{font-size:3.4rem;line-height:1.1}
.checks{display:grid;gap:8px;margin:14px 0}
.checks .ck{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.checks .ck.ok{border-color:var(--lagoon)}
.checks .ck.no{border-color:var(--danger)}
.checks .ck .mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85rem;flex-shrink:0}
.checks .ck.ok .mk{background:var(--lagoon)}
.checks .ck.no .mk{background:var(--danger)}
.unmask{display:flex;gap:14px;align-items:center;margin:14px 0;padding:12px;border-radius:16px;background:var(--plum);color:#fff}
.unmask .uv{width:64px;height:64px;flex-shrink:0}
.led{display:grid;gap:8px;margin-top:10px}
.led .lr{border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:.9rem}
.led .lt{font-weight:600;margin-bottom:4px}
.led .pk{display:inline-flex;align-items:center;gap:4px;margin-right:12px}
.led .pk .la{width:24px;height:24px}
.loading{text-align:center;padding:48px 10px}
.spin{width:44px;height:44px;margin:0 auto 16px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--coral);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--sea);padding:10px 18px;border-radius:999px;font-size:.92rem;z-index:40}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(() => {
'use strict';

/* =====================================================

const CHARS = [
 {id:'mermaid', name:'Little Mermaid', src:'Hans Christian Andersen, 1837',

  back:HB.long('#e9c46a'),
  acc:`<path d="M20 29Q40 10 60 29" fill="none" stroke="#2b2b3a" stroke-width="3.6" stroke-linecap="round"/>` + prop(-7, -8, `<path d="M62 59Q58 50 52 54" fill="none" stroke="#a8861a" stroke-width="1.4"/><circle cx="62" cy="68" r="9" fill="#f4d77a" stroke="#a8861a" stroke-width="1.4"/><circle cx="62" cy="68" r="6.2" fill="#fffdf2"/><path d="M62 68L62 63.5M62 68L65.6 69.6" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>`)},

const charById = id => CHARS.find(c => c.id === id) || CHARS[0];

let avN = 0;
function avatar(ch) {
  const id = 'avc' + (avN++);
  const front = ch.front === undefined ? FR(ch.hair) : ch.front;
  return `<svg class="face" viewBox="0 0 80 80" aria-hidden="true">
    <defs><clipPath id="${id}"><circle cx="40" cy="40" r="38"/></clipPath></defs>
    <g clip-path="url(#${id})">
      <rect width="80" height="80" fill="${ch.bg}"/>

      <rect x="35" y="50" width="10" height="14" fill="${ch.skin}"/>
      <path d="M8 82Q10 59 40 57Q70 59 72 82Z" fill="${ch.cloth}"/>
      <circle cx="40" cy="38" r="19" fill="${ch.skin}"/>
      ${front}
      <circle class="cheek" cx="29" cy="43" r="3.4" fill="#ff8f8f" opacity=".28"/><circle class="cheek" cx="51" cy="43" r="3.4" fill="#ff8f8f" opacity=".28"/>
      <circle cx="33" cy="37" r="2.8" fill="#16314a"/><circle cx="47" cy="37" r="2.8" fill="#16314a"/>
      <circle cx="33.9" cy="36" r="1" fill="#fff"/><circle cx="47.9" cy="36" r="1" fill="#fff"/>

/* =====================================================

const VOICE = {

const REALMS = {

const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const ARCH = [
 {id:'crossing', make:(r,g,s) => ({title:`Across ${r.name}`, narration:`Between you and ${g} lies ${r.feature}. ${s} knows this ground best, but even they admit it looks tricky.`,

    document.body.appendChild(ov);
    const done = v => { document.removeEventListener('keydown', onKey, true); ov.remove(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', onKey, true);
    ov.onclick = e => { if (e.target === ov) done(false); };

    ov.querySelector('#cdNo').focus();
  });
}

/* =====================================================
   Camera guard (computer vision, runs only on this device)
   Detects: how many faces are looking at the screen, and
   how many fingers a hand is holding up. It never identifies
   anyone, and no frames are saved or sent anywhere.
   ===================================================== */
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const CV = {state:'off', error:'', stream:null, video:null, face:null, hand:null, timer:null, wantHands:false, busy:false, errs:0, provider:null, subs:new Set(), last:{faces:0, fingers:null, t:0}};

function camError(e) {
  const n = e && e.name, msg = (e && e.message) || '';
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'Camera permission was blocked. Allow the camera for this page, or use Honor mode.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'No camera was found on this device.';
  if (n === 'NotReadableError') return 'The camera is busy in another app.';
  if (/import|fetch|network|load|wasm|module/i.test(msg)) return 'The camera guard couldn’t download its vision models. Check your internet connection (needed once), or use Honor mode.';
  return msg || 'The camera guard couldn’t start.';
}
async function cvEnable() {
  if (CV.state === 'ready') return true;
  CV.state = 'loading'; CV.error = '';
  try {
    if (window.__cvProvider) CV.provider = window.__cvProvider;
    else {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('This browser can’t open the camera here. Camera access needs a secure page (https) or a local file.');
      CV.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false});
      const v = document.createElement('video');
      v.muted = true; v.playsInline = true; v.autoplay = true; v.srcObject = CV.stream; v.setAttribute('aria-hidden', 'true');
      v.style.cssText = 'position:fixed;left:0;bottom:0;width:80px;height:60px;opacity:.01;pointer-events:none;z-index:-1';
      document.body.appendChild(v); CV.video = v;
      await v.play().catch(() => {});
      const vision = await import(MP + '/vision_bundle.mjs');
      const fs = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
      const make = async (Cls, path, extra) => {
        for (const delegate of ['GPU', 'CPU']) {
          try { return await Cls.createFromOptions(fs, Object.assign({baseOptions:{modelAssetPath:path, delegate}, runningMode:'VIDEO'}, extra)); }
          catch (e) { if (delegate === 'CPU') throw e; }
        }
      };
      CV.face = await make(vision.FaceDetector, FACE_MODEL, {minDetectionConfidence:0.5});
      CV.hand = await make(vision.HandLandmarker, HAND_MODEL, {numHands:1, minHandDetectionConfidence:0.5});
      CV.provider = mediapipeSample;
    }
    CV.state = 'ready'; CV.errs = 0;
    clearInterval(CV.timer); CV.timer = setInterval(cvTick, 110);
    return true;
  } catch (e) { cvDisable(); CV.state = 'error'; CV.error = camError(e); return false; }
}
function cvDisable() {
  clearInterval(CV.timer); CV.timer = null;
  try { if (CV.stream) CV.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  try { if (CV.face) CV.face.close(); if (CV.hand) CV.hand.close(); } catch (e) {}
  if (CV.video) CV.video.remove();
  CV.stream = CV.video = CV.face = CV.hand = CV.provider = null; CV.subs.clear(); CV.wantHands = false; CV.state = 'off';
}
function countFingers(lm) {
  const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y), w = lm[0];
  let n = 0;
  [[8,6],[12,10],[16,14],[20,18]].forEach(([tip, pip]) => { if (d(lm[tip], w) > d(lm[pip], w) * 1.12) n++; });
  return n;
}
/* A thumbs up: the four fingers curled, the thumb stretched out and pointing mostly upward */
function isThumbsUp(lm) {
  const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y), w = lm[0];
  if (countFingers(lm) !== 0) return false;
  const extended = d(lm[4], w) > d(lm[3], w) * 1.1 && d(lm[4], w) > d(lm[2], w) * 1.2;
  const rise = lm[2].y - lm[4].y;                    // image y grows downward, so a raised thumb has the smaller y
  return extended && rise > 0.06 && rise > Math.abs(lm[4].x - lm[2].x) * 0.9;
}
function mediapipeSample() {
  const t = performance.now(), vw = CV.video.videoWidth || 640;
  if (!CV.video.videoWidth) return {faces:[], fingers:null, thumbs:false};
  const fr = CV.face.detectForVideo(CV.video, t);
  const faces = (fr.detections || []).map(d => ({w: d.boundingBox.width / vw}));
  let fingers = null, thumbs = false;
  if (CV.wantHands) {
    const hr = CV.hand.detectForVideo(CV.video, t);
    if (hr.landmarks && hr.landmarks[0]) { fingers = countFingers(hr.landmarks[0]); thumbs = isThumbsUp(hr.landmarks[0]); }
  }
  return {faces, fingers, thumbs};
}
function cvTick() {
  if (CV.state !== 'ready' || CV.busy || !CV.provider) return;
  CV.busy = true;
  try {
    const r = CV.provider(CV.wantHands);
    CV.last = {faces: (r.faces || []).filter(f => f.w >= 0.08).length, fingers: r.fingers == null ? null : r.fingers, thumbs: !!r.thumbs, t: performance.now()};
    CV.errs = 0;
    CV.subs.forEach(f => f(CV.last));
  } catch (e) {
    if (++CV.errs > 30) { cvDisable(); CV.state = 'error'; CV.error = 'The camera guard stopped working.'; if (G) { G.guard = 'honor'; toast('Camera guard stopped. Switched to Honor mode.'); } }
  }
  CV.busy = false;
}
const cvSub = fn => { CV.subs.add(fn); return () => CV.subs.delete(fn); };

/* Turns raw frames into a steady verdict: clear / crowded / empty / pending */
function makeGuard() {
  let clearSince = 0, emptySince = 0, crowd = 0, state = 'pending';
  return f => {
    const t = f.t;
    if (f.faces >= 2) { crowd++; clearSince = 0; emptySince = 0; }
    else if (f.faces === 1) { crowd = 0; emptySince = 0; if (!clearSince) clearSince = t; }
    else { crowd = 0; clearSince = 0; if (!emptySince) emptySince = t; }
    let next = null;
    if (crowd >= 2) next = 'crowded';
    else if (f.faces === 0 && t - emptySince >= 1200) next = 'empty';
    else if (f.faces === 1 && t - clearSince >= 700) next = 'clear';
    else if (f.faces === 1 && state !== 'clear') next = 'pending';
    if (next) state = next;
    return state;
  };
}

/* =====================================================
   Story: built-in storyteller
   ===================================================== */
function buildBuiltinStory(players, n) {
  const q = pick(QUESTS), order = shuffle(players), archs = shuffle(ARCH);
  const chapters = [];
  for (let i = 0; i < n; i++) {
    const spot = order[i % order.length], realm = REALMS[spot.charId], last = i === n - 1;
    const arch = last ? FINALE : archs[i % archs.length], base = arch.make(realm, q.goal, spot.name);
    const K = pathCountFor(players.length), kinds = shuffle(KIND_SETS[K]);
    chapters.push({
      title: base.title, scene: realm.scene, challenge: arch.id, spotId: spot.id, narration: base.narration,
      options: base.options.slice(0, K).map((o, k) => ({label: o.label, emoji: o.e, kind: kinds[k],
        result: `The party ${o.did}. ` + (kinds[k] === 'good' ? pick(GOOD) : kinds[k] === 'mixed' ? pick(MIXED) : 'It was a trap! ' + realm.trap)}))
    });
  }
  return {title: q.title, goal: q.goal, premise: `${q.premise} ${joinNames(players.map(p => p.name))} set out together to bring it home.`, win: q.win, lose: q.lose, chapters, source:'builtin'};
}

function renderBusy() {
  $app.innerHTML = `<div class="loading" role="status"><div class="spin"></div><h2>${esc(BUSY.msg || 'One moment…')}</h2>
    <p class="lede" style="margin:10px auto 18px">${esc(BUSY.sub || '')}</p><button class="btn small" id="cancel">Cancel</button></div>`;
  $('cancel').onclick = () => { S.view = 'home'; render(); };
}

async function beginTale() {
  const camP = S.opts.guard === 'camera' && CV.state !== 'ready' ? cvEnable() : null;     // must start inside the tap
  let notice = '';
  if (camP) {
    S.view = 'busy'; BUSY = {msg:'Starting the camera guard…', sub:'Allow the camera when your browser asks.'}; renderBusy();
    const ok = await camP;
    if (!ok) { notice = CV.error + ' Switched to Honor mode.'; S.opts.guard = 'honor'; save(); }
    if (S.view !== 'busy') return;
  }
  const players = S.people.map(p => ({id:p.id, charId:p.charId, name:p.name, color:p.color, role:'hero'}));
  startGame(players, buildBuiltinStory(players, S.opts.chapters), notice);
}

/* =====================================================
   Game engine
   ===================================================== */
function startGame(players, story, notice) {
  const vi = randInt(players.length);
  players[vi].role = 'villain';
  G = {players, villainId: players[vi].id, story, hope: startHopeFor(players.length, S.opts.villain), tokens: players.length >= 6 ? 3 : 2,
    votes: {}, cursed: {}, results: [], accuse: {}, steps: [], si: 0, timers: [], ints: [],
    guard: (CV.state === 'ready' && S.opts.guard === 'camera') ? 'camera' : 'honor', label: 'Prologue', pendingNotice: notice};
  G.clues = story.chapters.map(ch => makeClues(ch));
  G.steps = [...players.map(p => ({k:'role', pid:p.id})), {k:'intro'}, ...chapterSteps(0)];
  S.view = 'game';
  runStep();
}
function rotate(ci) { const n = G.players.length, s = ci % n; return G.players.slice(s).concat(G.players.slice(0, s)); }
function chapterSteps(ci) {
  const order = rotate(ci);
  return [{k:'chapter', ci}, ...order.map(p => ({k:'whisper', ci, pid:p.id})), {k:'discuss', ci}, ...order.map(p => ({k:'vote', ci, pid:p.id})), {k:'result', ci}];
}
function finaleSteps() {
  return [{k:'finale'}, {k:'truth'}, {k:'discuss', accuse:true}, ...G.players.map(p => ({k:'accuse', pid:p.id})), {k:'accuseReveal'}, {k:'ending'}];
}
function makeClues(ch) {
  const kinds = ch.options.map(o => o.kind), all = k => kinds.map((x, i) => x === k ? i : -1).filter(i => i >= 0);
  const goods = all('good'), traps = all('trap'), safe = shuffle(kinds.map((x, i) => x !== 'trap' ? i : -1).filter(i => i >= 0));
  const lab = i => ch.options[i].label;
  const heroes = G.players.filter(p => p.role === 'hero');
  let wi = 0; const clues = {};
  heroes.forEach(h => {
    if (h.id === ch.spotId) clues[h.id] = Math.random() < .5
      ? {strong:true, text:`Beware “${lab(pick(traps))}”. That way is a trap.`}
      : {strong:true, text:`“${lab(pick(goods))}” is the wisest path.`};
    else clues[h.id] = {strong:false, text:`“${lab(safe[wi++ % safe.length])}” will not doom you.`};
  });
  return clues;
}
const P = id => G.players.find(p => p.id === id);
function later(fn, ms) { const t = setTimeout(fn, ms); G.timers.push(t); return t; }
function clearTimers() { if (!G) return; G.timers.forEach(clearTimeout); G.ints.forEach(clearInterval); G.timers = []; G.ints = []; disarmThumb(); }

/* Thumbs up moves on: hold one to the camera and the screen's main button is pressed for you. */
const THUMB_HOLD = 2000;            // ms of an unbroken thumbs up needed to move on (the discussion screen asks for more)
const THUMB_TARGETS = '#go, #okRole, #okW, #passOn, #lockV';
function thumbTarget() {
  const el = document.querySelector(THUMB_TARGETS);
  if (!el || el.disabled || el.offsetParent === null) return null;               // missing, disabled or hidden (e.g. peek cover)
  if (el.dataset.nothumb) return null;                                           // discussion screens: tap the button instead
  const fading = el.closest('.later');
  if (fading && parseFloat(getComputedStyle(fading).opacity) < .95) return null;   // not shown yet
  return el;
}
function ensureThumbHint(btn) {
  const old = $('thumbhint');
  if (old && old.dataset.for === btn.id) return;
  if (old) old.remove();
  const secs = (+btn.dataset.hold || THUMB_HOLD) / 1000;
  (btn.closest('.actions') || btn).insertAdjacentHTML('afterend',
    `<div class="thumbhint" id="thumbhint" data-for="${btn.id}">👍 Or hold a thumbs up to the camera for ${secs} seconds ${btn.id === 'lockV' ? 'to lock in' : 'to continue'}.<div class="fbar"><i id="tprog"></i></div></div>`);
}
function disarmThumb() { if (G && G.thumbUnsub) { G.thumbUnsub(); G.thumbUnsub = null; } CV.wantHands = false; }
function armThumb() {
  disarmThumb();
  if (!G || G.guard !== 'camera' || CV.state !== 'ready') return;
  CV.wantHands = true;
  let start = 0, cool = 0;
  G.thumbUnsub = cvSub(f => {
    const btn = thumbTarget(); if (!btn) { start = 0; return; }
    ensureThumbHint(btn);
    const bar = $('tprog');
    if (!f.thumbs || f.t < cool) { start = 0; if (bar) bar.style.width = '0'; return; }
    if (!start) start = f.t;
    const pr = Math.min(1, (f.t - start) / (+btn.dataset.hold || THUMB_HOLD));
    if (bar) bar.style.width = (pr * 100) + '%';
    if (pr >= 1) { start = 0; cool = f.t + 1500; btn.click(); }
  });
}
function runStep() {
  clearTimers();
  const s = G.steps[G.si]; if (!s) return;
  dispatchStep(s);
  armThumb();
}
function dispatchStep(s) {
  switch (s.k) {
    case 'role':    return privateTurn(P(s.pid), 'for your secret role', buildRole);
    case 'intro':   return screenIntro();
    case 'chapter': return screenChapter(s.ci);
    case 'whisper': return privateTurn(P(s.pid), 'for a private whisper', (box, done, p) => buildWhisper(box, done, p, s.ci));
    case 'discuss': return screenDiscuss(s);
    case 'vote':    return privateTurn(P(s.pid), 'to cast your secret vote', (box, done, p) => buildVote(box, done, p, s.ci));
    case 'result':  return screenResult(s.ci);
    case 'finale':  return screenFinale();
    case 'truth':   return screenTruth();
    case 'accuse':  return privateTurn(P(s.pid), 'to name the Villain', buildAccuse);
    case 'accuseReveal': return screenAccuseReveal();
    case 'ending':  return screenEnding();
  }
}
function advance() {
  const prev = G.steps[G.si]; G.si++;
  if (prev && prev.k === 'result') {
    const N = G.story.chapters.length;
    if (G.hope <= 0 || prev.ci >= N - 1) G.steps.push(...finaleSteps()); else G.steps.push(...chapterSteps(prev.ci + 1));
  }
  runStep();
}
function leaveGame() {
  clearTimers(); G = null; cvDisable(); S.view = 'home'; renderHome(); window.scrollTo(0, 0);
}
function resolveChapter(ci) {
  if (G.results[ci]) return;
  const votes = G.votes[ci] || {}, ch = G.story.chapters[ci], counts = ch.options.map(() => 0);
  Object.values(votes).forEach(i => counts[i]++);
  const max = Math.max(...counts), tied = counts.map((c, i) => c === max ? i : -1).filter(i => i >= 0);
  const dithered = tied.length > 1;                       // a tie: the party argues in circles and takes the shaky way
  const win = dithered ? null : tied[0];
  const kind = dithered ? 'mixed' : ch.options[win].kind, cursed = !!G.cursed[ci], before = G.hope;
  G.hope = Math.max(0, Math.min(10, G.hope + KIND_DELTA[kind] - (cursed ? 1 : 0)));
  G.results[ci] = {counts, win, kind, cursed, before, after: G.hope, dithered};
}

   ===================================================== */
function privateTurn(p, what, build) {
  clearTimers();
  const cam = G.guard === 'camera' && CV.state === 'ready';
  const ch = charById(p.charId);
  $app.innerHTML = hudHTML() + `
    <div class="secret" id="secret">
      <div class="lock" id="lock">
        <div class="big">${avatar(ch)}</div>
        <h2>Pass the phone to ${esc(p.name)}</h2>
        <p class="sub">${esc(what.charAt(0).toUpperCase() + what.slice(1))}. Everyone else, look away.</p>
        ${cam ? `<video class="camprev pending" id="prev" autoplay muted playsinline></video><p class="gstat" id="gstat" role="status">Looking for you…</p>` : `<p class="gstat">Make sure only you can see the screen.</p>`}
        <button class="btn primary" id="reveal" ${cam ? 'disabled' : ''}>Tap to reveal ▶</button>
      </div>
      <div id="content" hidden></div>
      <div class="breach" id="breach" hidden><div class="bi">🙈</div><h2>Someone’s peeking!</h2><p class="sub" id="bmsg" style="margin:8px 0 6px">Everyone else, look away.</p><p class="sub">Your screen comes back by itself as soon as only you are in view.</p></div>
    </div>`;
  wireHud();
  const prev = $('prev'); if (prev && CV.stream) { prev.srcObject = CV.stream; prev.play().catch(() => {}); }
  let state = 'pending', revealed = false, unsubG = null, ended = false;
  const guard = makeGuard();
  const STAT = {pending:'Hold still, looking for you…', clear:'✓ Just you. Tap to reveal when you’re ready.', empty:'I can’t see anyone. Look at the camera.', crowded:'More than one person in view! Everyone else, look away or step back.'};
  const finish = () => { if (ended) return; ended = true; if (unsubG) unsubG(); advance(); };
  const doReveal = () => {
    if (revealed) return; revealed = true;
    $('lock').hidden = true;
    const box = $('content'); box.hidden = false; box.innerHTML = '';
    build(box, finish, p);
    if (cam) box.insertAdjacentHTML('afterbegin', `<div class="gbar" id="gbar"><i></i> Guard watching</div>`);
  };
  const onFrame = f => {
    state = guard(f);
    if (!revealed) {                                   // the camera only unlocks the button. The player always has to tap it.
      const pv = $('prev'), gs = $('gstat'), rb = $('reveal'); if (!pv) return;
      pv.className = 'camprev ' + state; gs.textContent = STAT[state]; rb.disabled = state !== 'clear';
    } else if (state === 'crowded' || state === 'empty') {
      $('content').hidden = true; $('breach').hidden = false;
      $('bmsg').textContent = state === 'crowded' ? 'More than one person is in view. Everyone else, look away.' : 'I can’t see you. Look at the camera.';
    } else if (!$('breach').hidden && state === 'clear') {
      $('breach').hidden = true; $('content').hidden = false;
    }
  };
  if (cam) unsubG = cvSub(onFrame);
  $('reveal').onclick = () => { if (cam && state !== 'clear') return; doReveal(); };
  window.scrollTo(0, 0);
}

function buildWhisper(box, done, p, ci) {

/* A shared "pick one in secret" screen, by tap or by holding up fingers */
function secretChoice(box, done, cfg) {
  const order = shuffle(cfg.items), max = order.length;
  let chosen = null, locked = false;
  const gestures = G.guard === 'camera' && CV.state === 'ready';
  const tog = gestures && cfg.toggle ? cfg.toggle : null;
  const selMax = Math.min(max, tog ? tog.finger - 1 : 4);          // finger counts that pick an option (a toggle sign is reserved)
  const tapNote = max > selMax ? (max - selMax === 1 ? ` Option ${max} is chosen by tapping.` : ` Options ${selMax + 1} to ${max} are chosen by tapping.`) : '';
  const fingText = `✋ Or hold up ${selMax === 1 ? '1 finger' : selMax === 2 ? '1 or 2 fingers' : '1 to ' + selMax + ' fingers'} to the camera for a second and a half.${tapNote}` + (tog ? ` Hold up ${tog.finger} fingers to switch ${tog.name} on or off.` : '');
  box.innerHTML = `<h2>${esc(cfg.title)}</h2><p class="sub">${esc(cfg.sub)} Your list is in a random order, just for you.</p>
    ${cfg.before || ''}
    <div class="vopts" id="vopts">${order.map((it, i) => `<button class="vopt" data-i="${i}"><span class="num">${i + 1}</span>${it.html}</button>`).join('')}</div>
    ${cfg.extra || ''}
    ${cfg.remind || ''}
    ${gestures ? `<div class="fing" id="fing">${fingText}<div class="fbar"><i id="fprog"></i></div><span id="ftxt"></span></div>` : ''}
    <div class="actions"><button class="btn primary" id="lockV" disabled>Lock in my vote</button></div>`;
  const sel = i => { chosen = i; box.querySelectorAll('.vopt').forEach(b => b.classList.toggle('sel', +b.dataset.i === i)); $('lockV').disabled = false; };
  box.querySelector('#vopts').onclick = e => { if (locked) return; const b = e.target.closest('.vopt'); if (b) sel(+b.dataset.i); };
  const tgl = box.querySelector('#shadowT');
  if (tgl) tgl.onchange = () => { const st = $('togState'); if (st) st.textContent = tgl.checked ? 'ON' : 'OFF'; };
  let unsubF = null;
  const lock = () => {
    if (locked || chosen === null) return; locked = true; if (unsubF) unsubF();
    cfg.onLock(order[chosen].key, box);
    box.innerHTML = `<div class="sealed"><div class="tk" aria-hidden="true">🎟️</div><h2>Vote sealed</h2><p class="sub" style="margin:6px 0 18px">Nobody can see it now.</p><button class="btn primary" id="passOn">Continue ▶</button></div>`;
    $('passOn').onclick = done;
    if (G.guard === 'camera' && CV.state === 'ready') later(done, 1400);   // nothing left to read, so move on by itself
  };
  $('lockV').onclick = lock;
  if (gestures) {
    CV.wantHands = true;
    let cur = null, since = 0, tstart = 0, togReady = true, rel = 0;
    unsubF = cvSub(f => {
      const fp = $('fprog'), ft = $('ftxt');
      if (locked || $('content').hidden) { cur = null; since = 0; tstart = 0; if (fp) fp.style.width = '0'; return; }
      if (!fp) return;
      const v = f.fingers;
      if (tog) {                                           // the 4-finger sign flips the switch, once per raise
        if (v === tog.finger) {
          rel = 0; cur = null; since = 0;
          if (!togReady) { ft.textContent = 'Lower your hand to switch it again.'; fp.style.width = '0'; return; }
          if (!tstart) tstart = f.t;
          const pr = Math.min(1, (f.t - tstart) / 900);
          fp.style.width = (pr * 100) + '%'; ft.textContent = `Detected ${v}. Hold to switch ${tog.name}…`;
          if (pr >= 1) { tstart = 0; togReady = false; tog.flip(); const el = $('shadowT'); ft.textContent = `${tog.name.charAt(0).toUpperCase() + tog.name.slice(1)} is now ${el && el.checked ? 'ON' : 'OFF'}.`; }
          return;
        }
        tstart = 0;
        if (!togReady) { if (!rel) rel = f.t; if (f.t - rel >= 400) { togReady = true; rel = 0; } }
      }
      const ok = v != null && v >= 1 && v <= selMax;
      if (!ok) { cur = null; since = 0; fp.style.width = '0'; if (!tog || togReady) ft.textContent = ''; return; }
      if (v !== cur) { cur = v; since = f.t; }
      const pr = Math.min(1, (f.t - since) / 1500);
      fp.style.width = (pr * 100) + '%'; ft.textContent = `Detected ${v}. Hold steady…`;
      if (pr >= 1) { sel(v - 1); lock(); }
    });
  }
}
/* Each player's whisper, shown again while they vote so it is easy to remember */
function hintBox(ch, ci, p) {
  if (p.role === 'villain') {
    const tag = {good:'Good', mixed:'Shaky', trap:'Trap'};
    return `<div class="hintbox"><b>Your whisper: the truth</b><ul class="truth compact">${['good','mixed','trap'].flatMap(k => ch.options.filter(o => o.kind === k).map(o => `<li class="${k}"><span>${esc(o.emoji)}</span><span><small>${tag[k]}</small>${esc(o.label)}</span></li>`)).join('')}</ul></div>`;
  }
  const c = G.clues[ci][p.id];
  return `<div class="hintbox"><b>Your whisper</b><div class="clue"><span class="tag ${c.strong ? '' : 'faint'}">${c.strong ? 'A strong hint' : 'A faint hint'}</span><br>${esc(c.text)}</div></div>`;
}
function buildVote(box, done, p, ci) {
  const ch = G.story.chapters[ci], villain = p.role === 'villain';
  const flip = () => { const el = $('shadowT'); if (!el) return; el.checked = !el.checked; const st = $('togState'); if (st) st.textContent = el.checked ? 'ON' : 'OFF'; };
  secretChoice(box, done, {
    title: 'Cast your secret vote', sub: ch.title + '.',
    items: ch.options.map((o, i) => ({key:i, html:`<span class="ve">${esc(o.emoji)}</span><span class="vl">${esc(o.label)}</span>`})),
    remind: remind(p.role, 'vote'), before: hintBox(ch, ci, p),
    // Only the Villain has the switch (tap it, or hold up 4 fingers in camera mode). Heroes have nothing on that sign.
    extra: villain ? `<label class="shadow"><input type="checkbox" id="shadowT"><span>🦇 Shadow of the Gloom: <b id="togState">OFF</b> <small>(${G.tokens} left${G.tokens ? '' : ', so it won’t work'})</small></span></label>` : '',
    toggle: villain ? {finger:4, name:'your Shadow', flip} : null,
    onLock: (key, bx) => {
      (G.votes[ci] = G.votes[ci] || {})[p.id] = key;
      const sh = bx.querySelector('#shadowT');
      if (villain && G.tokens > 0 && sh && sh.checked) { G.cursed[ci] = true; G.tokens--; }
    }
  });
}
function buildAccuse(box, done, p) {

   ===================================================== */
function screenIntro() {
  paintPublic({label:'Prologue', scene:'outdoor', prop:'🏰', walk:true, act:'calm', hope:G.hope, panel:
    `<h2>${esc(G.story.title)}</h2><p class="lede" style="margin:8px 0 0">${esc(G.story.premise)}</p>
     <div class="pcast">${G.players.map(p => `<span class="pc"><span class="mv">${avatar(charById(p.charId))}</span>${esc(p.name)}</span>`).join('')}</div>
     <div class="notice">🗡️ <b>One of you is the Villain.</b> Heroes: finish the quest and unmask them. Villain: sink the quest and stay hidden.</div>
     ${G.pendingNotice ? `<div class="banner err">${esc(G.pendingNotice)}</div>` : ''}
     <div class="actions"><button class="btn primary" id="go">Begin chapter 1 ▶</button></div>`});
  G.pendingNotice = '';
  G.players.forEach((p, i) => later(() => say(p.id, INTRO_LINES[i % INTRO_LINES.length]), 1200 + i * 1700));
  $('go').onclick = advance;
}
function screenChapter(ci) {
  const ch = G.story.chapters[ci], N = G.story.chapters.length, sp = P(ch.spotId);
  paintPublic({label:`Chapter ${ci + 1} of ${N}`, scene:ch.scene, prop:'', challenge:ch.challenge, title:{kick:`Chapter ${ci + 1} of ${N}`, text:ch.title}, walk:true, act:'calm', panel:
    `<p class="kick">Chapter ${ci + 1} of ${N}</p><h2>${esc(ch.title)}</h2>
     <div style="margin-top:10px">${narr(esc(ch.narration))}</div>
     <div class="optlist">${ch.options.map(o => `<div class="opt"><span class="oe" aria-hidden="true">${esc(o.emoji)}</span><b>${esc(o.label)}</b></div>`).join('')}</div>
     <p class="meta" style="margin-top:12px">🔦 ${esc(sp.name)} is in the spotlight. If they’re a Hero, their hint is a strong one.</p>
     <div class="actions"><button class="btn primary" id="go">Receive your whispers ▶</button></div>`});
  const sa = actorEl(sp.id); if (sa) sa.classList.add('spot');
  later(() => say(sp.id, 'This is my home ground. Listen closely.'), 3700);
  $('go').onclick = advance;
}
function screenDiscuss(s) {
  const acc = !!s.accuse, N = G.story.chapters.length;
  const starters = acc
    ? ['Whose claims did not match the truth you just saw?','Who pushed for a path that went badly?','Did a spotlight traveler claim only a faint hint?','Who stayed suspiciously quiet?']
    : ['What did your whisper say?','Does anyone’s hint clash with yours?','Which path feels safest, and why?','Who should we trust this time?'];
  paintPublic({label: acc ? 'Judgment' : `Chapter ${s.ci + 1} of ${N}`, scene:'night', prop:'💬', walk:false, act:'', panel:
    `<h2>${acc ? 'Who served the Gloom?' : 'Talk it over'}</h2>
     <div style="margin-top:10px">${narr(acc ? 'Someone among you served the Gloom in secret. Compare what each person told you with the truth, and take as long as you need. Then each of you will name a suspect in private.' : 'Put the phone down and talk. Share your whisper, hide it, or stretch it. One of you may be lying. Take as long as you like.')}</div>
     <p class="meta" style="margin-top:12px">Try asking:</p>
     <ul class="starters">${starters.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
     <div class="actions"><button class="btn primary" id="go" data-nothumb="1">${acc ? 'We’re ready to name a suspect ▶' : 'We’ve talked it over. Vote ▶'}</button></div>`});
  $('go').onclick = advance;
}
function screenResult(ci) {
  resolveChapter(ci);
  const ch = G.story.chapters[ci], r = G.results[ci], N = G.story.chapters.length;
  const resultText = r.dithered ? 'The party can’t agree. They argue in circles until the shaky way is the only one left, and they stumble through it.' : ch.options[r.win].result;
  const mood = {good:'love', mixed:'meh', trap:'sad'}[r.kind];
  const burst = {good:'✨', mixed:'💨', trap:'💥'}[r.kind];
  paintPublic({label:`Chapter ${ci + 1} of ${N}`, scene:ch.scene, prop:'', challenge:ch.challenge, walk:false, act:'', hope:r.before, panel:
    `${narr('The votes are in…')}
     <div class="tally">${ch.options.map((o, k) => `<div class="trow ${k === r.win ? 'win' : ''}" style="--k:${k}"><span class="te" aria-hidden="true">${esc(o.emoji)}</span><span class="tmid">${esc(o.label)}</span><span class="tcount">${r.counts[k]}</span></div>`).join('')}</div>
     ${r.dithered ? `<p class="meta later" style="--d:1.6s;margin-top:8px"><b>A tie!</b> Nobody won, so the party dithers.</p>` : ''}
     <div class="later" style="--d:2s;margin-top:14px">${narr(esc(resultText))}</div>
     ${r.cursed ? `<div class="notice later" style="--d:3s">🦇 A cold shadow slipped across the party, and something went quietly wrong. Someone here is working against you.</div>` : ''}
     <div class="later" style="--d:3.6s"><p class="meta" style="margin-top:12px">Hope: ${r.before} → <b>${r.after}</b></p>
     <div class="actions"><button class="btn primary" id="go">${G.hope <= 0 ? 'The light fades… ▶' : (ci >= N - 1 ? 'To the finale ▶' : 'On to chapter ' + (ci + 2) + ' ▶')}</button></div></div>`});
  later(() => {
    const st = $('stage'); if (st) { st.classList.add('res-' + r.kind); st.insertAdjacentHTML('beforeend', `<div class="burst" aria-hidden="true">${burst}</div>`); }
    G.players.forEach(p => setMood(p.id, mood)); setHope(r.after); say(ch.spotId, voiceLine(ch.spotId, r.kind));
  }, 2000);
  later(() => { const other = pick(G.players.filter(p => p.id !== ch.spotId)); say(other.id, voiceLine(other.id, r.kind)); }, 4400);
  $('go').onclick = advance;
}
function screenFinale() {
  const N = G.story.chapters.length, completed = G.hope > 0;
  G.questWon = completed && G.hope >= WIN_HOPE;
  paintPublic({label:'Finale', scene: G.questWon ? 'outdoor' : 'night', prop: G.questWon ? '🏆' : '🦇', walk:false, act:'', panel:
    `<p class="kick">${G.questWon ? 'The quest is won' : 'The quest is lost'}</p>
     <h2>${G.questWon ? 'Victory at the last gate' : (completed ? 'The light was too faint' : 'The light has gone out')}</h2>
     <div style="margin-top:10px">${narr(esc(!completed ? 'Hope ran out before the tale was done. ' + G.story.lose : G.questWon ? G.story.win : G.story.lose))}</div>
     <p class="meta" style="margin-top:12px">Final hope: <b>${G.hope}</b> of 10. You needed ${WIN_HOPE}.</p>
     <div class="notice">🗡️ But the tale isn’t over. <b>One of you was the Villain.</b> Time to find out who.</div>
     <div class="actions"><button class="btn primary" id="go">Face the judgment ▶</button></div>`});
  G.players.forEach(p => setMood(p.id, G.questWon ? 'love' : 'sad'));
  void N;
  $('go').onclick = advance;
}
function screenTruth() {
  const tagName = {good:'Best', mixed:'Shaky', trap:'Trap'};
  const rows = G.story.chapters.map((c, i) => {
    const r = G.results[i]; if (!r) return '';
    return `<div class="truth-row"><div class="tt">${i + 1}. ${esc(c.title)}${r.dithered ? ' <small>(the party dithered)</small>' : ''}</div>
      ${c.options.map((o, k) => `<div class="kopt ${k === r.win ? 'pickd' : ''}"><span class="kt ${o.kind}">${tagName[o.kind]}</span><span aria-hidden="true">${esc(o.emoji)}</span><span>${esc(o.label)}${k === r.win ? ' ← you chose this' : ''}</span></div>`).join('')}</div>`;
  }).join('');
  paintPublic({label:'The truth', scene:'night', prop:'🔍', walk:false, act:'', panel:
    `${narr('Here is what was really true in every chapter. Think back to what each of you said out loud. Heroes never gave a false hint.')}${rows}
     <div class="actions"><button class="btn primary" id="go">Talk it over ▶</button></div>`});
  $('go').onclick = advance;
}
function screenAccuseReveal() {
  const tallies = {}; G.players.forEach(p => tallies[p.id] = 0);
  Object.values(G.accuse).forEach(t => tallies[t]++);
  const max = Math.max(...Object.values(tallies)), top = Object.keys(tallies).filter(k => tallies[k] === max);
  G.accusedByCoin = top.length > 1;
  G.accused = top.length === 1 ? top[0] : top[randInt(top.length)];
  G.caught = G.accused === G.villainId;
  const lines = G.players.map(p => `<div class="trow later" style="--d:${1 + G.players.indexOf(p) * 1.5}s"><span class="te" style="width:36px;height:36px">${avatar(charById(p.charId))}</span><span class="tmid">${esc(p.name)} accuses <b>${esc(P(G.accuse[p.id]).name)}</b></span></div>`).join('');
  const t = 1 + G.players.length * 1.5;
  paintPublic({label:'Judgment', scene:'show', prop:'🥁', walk:false, act:'', panel:
    `${narr('Each of you has named a suspect…')}<div class="tally">${lines}</div>
     <div class="later" style="--d:${t}s;margin-top:14px">${G.accusedByCoin ? narr(`A tie! Fate points at <b>${esc(P(G.accused).name)}</b>.`) : narr(`The group points at <b>${esc(P(G.accused).name)}</b>!`)}</div>
     <div class="actions later" style="--d:${t + 1.2}s"><button class="btn primary" id="go">Unmask the Villain ▶</button></div>`});
  G.players.forEach((p, i) => later(() => { const a = actorEl(p.id); if (a) { a.classList.add('speaking'); } }, 1000 + i * 1500));
  $('go').onclick = advance;
}
function screenEnding() {
  const v = P(G.villainId), won = G.questWon, caught = G.caught, N = G.story.chapters.length;
  const tier = won && caught ? ['🏆','Heroes win!','You finished the quest and unmasked the Villain.'] :
               won && !caught ? ['🌗','A split verdict','The quest was won, but the Villain walks free.'] :
               !won && caught ? ['🌗','A split verdict','The quest fell apart, but you unmasked the Villain.'] :
                                ['🗡️','The Villain wins!','The quest failed and nobody saw the traitor coming.'];
  const wrong = G.accused && !caught ? P(G.accused).name : '';
  const shadows = Object.keys(G.cursed).map(i => +i + 1);
  const led = G.story.chapters.map((c, i) => `<div class="lr"><div class="lt">${i + 1}. ${esc(c.title)}${G.cursed[i] ? ' 🦇' : ''}</div>${
    G.players.map(p => { const k = (G.votes[i] || {})[p.id]; return k === undefined ? '' : `<span class="pk"><span class="la">${avatar(charById(p.charId))}</span>${esc(c.options[k].emoji)}</span>`; }).join('')}</div>`).join('');
  paintPublic({label:'The end', scene: won ? 'outdoor' : 'night', prop: tier[0], walk:false, act:'', panel:
    `<div class="endban"><div class="eb" aria-hidden="true">${tier[0]}</div><h2>${tier[1]}</h2><p class="lede" style="margin:6px auto 0">${tier[2]}</p></div>
     <div class="unmask"><span class="uv">${avatar(charById(v.charId))}</span><div><b>It was ${esc(v.name)}!</b><br><span style="opacity:.85">${shadows.length ? `Cast shadows in chapter${shadows.length > 1 ? 's' : ''} ${shadows.join(' and ')}.` : 'Never cast a single shadow.'}</span></div></div>
     ${wrong ? `<p class="meta">The group wrongly accused ${esc(wrong)}.</p>` : ''}
     <div class="checks">
       <div class="ck ${won ? 'ok' : 'no'}"><span class="mk">${won ? '✓' : '✕'}</span><span>Heroes: complete the quest</span></div>
       <div class="ck ${caught ? 'ok' : 'no'}"><span class="mk">${caught ? '✓' : '✕'}</span><span>Heroes: unmask the Villain</span></div>
       <div class="ck ${!won ? 'ok' : 'no'}"><span class="mk">${!won ? '✓' : '✕'}</span><span>Villain: sink the quest</span></div>
       <div class="ck ${!caught ? 'ok' : 'no'}"><span class="mk">${!caught ? '✓' : '✕'}</span><span>Villain: stay hidden</span></div></div>
     <p class="lbl" style="margin-top:16px">Who voted for what</p><div class="led">${led}</div>
     <div class="actions"><button class="btn primary" id="again">Play again with this cast</button><button class="btn ghost" id="home">Back to the cast</button></div>`});
  G.players.forEach(p => setMood(p.id, p.id === G.villainId ? (won && caught ? 'sad' : won ? 'meh' : 'love') : (won && caught ? 'love' : won ? 'meh' : 'sad')));
  void N;
  $('again').onclick = () => { leaveGame(); beginTale(); };
  $('home').onclick = leaveGame;
}

render();
})();
</script>
</body>
</html>
